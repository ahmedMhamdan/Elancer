# Elancer on Render: the public folder on the assigned port, sized for the free plan's 512 MB.
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 6
    MaxConnectionsPerChild 500
</IfModule>
KeepAliveTimeout 2

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # The host's health check arrives every few seconds and would bury the real requests.
    SetEnvIf Request_URI "^/up$" dontlog
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
