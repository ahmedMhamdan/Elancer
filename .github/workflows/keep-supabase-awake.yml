name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity.
# One small real query every 3 days keeps Elancer's database active.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "SUPABASE_DB_URL secret is missing"; exit 1; fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from users"
